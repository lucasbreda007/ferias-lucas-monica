name: Notificacoes das ferias

on:
  schedule:
    - cron: '30 * * * *'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar notificacao de teste agora'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: vacation-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar biblioteca Web Push
        run: npm install web-push@3 --no-save

      - name: Enviar notificacao
        env:
          PUSH_CONFIG_JSON: ${{ secrets.PUSH_CONFIG_JSON }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: node scripts/send-vacation-push.mjs
